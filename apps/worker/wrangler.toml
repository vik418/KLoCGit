name = "klocgit"
main = "src/index.ts"
compatibility_date = "2026-08-06"

[vars]
AUTH_ISSUER = "klocgit"
AUTH_AUDIENCE = "klocgit-api"
CANONICAL_REF = "refs/heads/main"
REDUCTION_BUDGET = '{"max_candidates":128,"max_futures":10000,"max_footprint_entries":100000,"max_output_bytes":4194304}'

[[durable_objects.bindings]]
name = "OBJECTIVES"
class_name = "ObjectiveCoordinator"

[[durable_objects.bindings]]
name = "REFS"
class_name = "RefCoordinator"

[[durable_objects.bindings]]
name = "REPOSITORIES"
class_name = "RepositoryDirectory"

[[durable_objects.bindings]]
name = "LEGACY_COORDINATOR"
class_name = "WorkspaceCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceCoordinator"]

[[migrations]]
tag = "convergence-1"
new_sqlite_classes = ["ObjectiveCoordinator", "RefCoordinator", "RepositoryDirectory"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/internal/*"]

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "klocgit-payloads"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "klocgit-analysis"

[[queues.producers]]
binding = "DEAD_LETTER_QUEUE"
queue = "klocgit-analysis-dlq"

[[queues.consumers]]
queue = "klocgit-analysis"
max_retries = 5
dead_letter_queue = "klocgit-analysis-dlq"

[[services]]
binding = "GIT_EXECUTOR"
service = "klocgit-git-executor"

[[services]]
binding = "ENGINE"
service = "klocgit-engine"

[observability]
enabled = true

[[artifacts]]
binding = "ARTIFACTS"
namespace = "klocgit"
