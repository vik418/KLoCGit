name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Configure test commit identity
        run: |
          git config --global user.name "klocgit tests"
          git config --global user.email "tests@localhost"
      - name: Load proposed interface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          const files = {".github/workflows/ci.yml":"f987a63df0290a6cbd001f994a20c1f97763578c","components.json":"e327248face9cb322e3f914050ceb703a1155b87","jsconfig.json":"f1a3469764d775e672b20048d146ebe04a573f9a","package-lock.json":"61db507c7c314d884f7ebb491a5ff150c25eb2ac","package.json":"dcd7eaa1273bbaa94862606443145878d8a397cd","public/favicon.svg":"7e4d9ab288bdcce4a8e5f53bc19c4c36d814afee","src/app/App.jsx":"bfcc0e39a648c31c906ed34b91907b7cb3c6b5e9","src/app/OwnerConnection.jsx":"58fe2f2e8d776b64e354a123ede3846047b13a34","src/app/WorkspaceHeader.jsx":"182549dd2c07515b2777ca95cba65db9667a92c1","src/features/decisions/DecisionCard.jsx":"642085a70252d60284897ea2e273ff8e7fd1d866","src/lib/utils.js":"9d7d3ea7c9072e8cdd4afd051f08c7f3f2ca357a","src/style.css":"3c9412eeac1e0db7d3e4814e532fbf120deb49a8","src/styles/base.css":"7a1330837a8bf89774e0e5e8e0252b291c93b52c","src/styles/interface.css":"193b4adc68e88a527575742e6e5a7ac64e31e7a2","src/ui/Button.jsx":"cbcde6efdb5c55b06bcffab23dcb8c4d4dae87fc","src/ui/Card.jsx":"924d6601675780f306da505446cbe60512d13372","src/ui/Input.jsx":"cb81a0e43703cabac737fbfeb1da0e51b8444c1e","vite.config.js":"1997bfcbcea783240b96cfbe9f5b3886bd483fd3"};
          for (const [path, sha] of Object.entries(files)) {
            const response = await fetch('https://api.github.com/repos/vik418/klocgit/git/blobs/' + sha, {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
            });
            if (!response.ok) throw new Error('Cannot read candidate blob: ' + response.status);
            const blob = await response.json();
            mkdirSync(dirname(path), { recursive: true });
            writeFileSync(path, Buffer.from(blob.content, 'base64'));
          }
          JS
      - run: npm ci
      - name: Format proposed interface
        run: |
          npx prettier .github/workflows/ci.yml components.json jsconfig.json package-lock.json package.json public/favicon.svg src/app/App.jsx src/app/OwnerConnection.jsx src/app/WorkspaceHeader.jsx src/features/decisions/DecisionCard.jsx src/lib/utils.js src/style.css src/styles/base.css src/styles/interface.css src/ui/Button.jsx src/ui/Card.jsx src/ui/Input.jsx vite.config.js --write --ignore-unknown
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const paths = [".github/workflows/ci.yml","components.json","jsconfig.json","package-lock.json","package.json","public/favicon.svg","src/app/App.jsx","src/app/OwnerConnection.jsx","src/app/WorkspaceHeader.jsx","src/features/decisions/DecisionCard.jsx","src/lib/utils.js","src/style.css","src/styles/base.css","src/styles/interface.css","src/ui/Button.jsx","src/ui/Card.jsx","src/ui/Input.jsx","vite.config.js"];
          for (const path of paths) {
            const data = Buffer.from(readFileSync(path)).toString('base64');
            for (let offset = 0; offset < data.length; offset += 4096) {
              console.log('KLOCGIT_SOURCE:' + path + ':' + data.slice(offset, offset + 4096));
            }
          }
          JS
      - run: npm run check
      - name: Check desktop and mobile interface
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          LOCAL_ACTOR_ID=ui-check LOCAL_OWNER_TOKEN=ui-check node server/local.mjs > /tmp/klocgit-ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const origin = 'http://127.0.0.1:43187';
          for (let attempt = 0; attempt < 90; attempt++) {
            try { if ((await fetch(origin)).ok) break; } catch {}
            if (attempt === 89) throw new Error('UI server did not start');
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 1280, height: 900 }, reducedMotion: 'reduce' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(error.message));
          async function capture(name) {
            const buffer = await page.screenshot({ type: 'png', fullPage: false });
            const data = buffer.toString('base64');
            for (let offset = 0; offset < data.length; offset += 4096) {
              console.log('KLOCGIT_SCREENSHOT:' + name + ':' + data.slice(offset, offset + 4096));
            }
          }
          await page.goto(origin);
          await page.getByRole('heading', { name: 'Connect to your workspace', level: 1 }).waitFor();
          assert.equal(await page.getByRole('button', { name: 'Connect to workspace', exact: true }).isDisabled(), true);
          await capture('connection');
          await page.getByLabel('Owner credential', { exact: true }).fill('ui-check');
          await page.getByRole('button', { name: 'Show owner credential', exact: true }).click();
          assert.equal(await page.getByLabel('Owner credential', { exact: true }).getAttribute('type'), 'text');
          await page.getByRole('button', { name: 'Hide owner credential', exact: true }).click();
          await page.getByRole('button', { name: 'Connect to workspace', exact: true }).click();
          await page.getByRole('heading', { name: 'Decisions', level: 1 }).waitFor();
          const contextChoice = page.getByRole('radio', { name: 'Retry using the same order identity', exact: true });
          if (await contextChoice.count()) {
            await contextChoice.check();
            await page.getByRole('button', { name: 'Start concurrent work', exact: true }).click();
          }
          await page.locator('.decision-card').first().waitFor({ timeout: 120000 });
          await capture('workspace');
          await page.getByRole('button', { name: 'Work', exact: true }).click();
          await page.getByRole('heading', { name: 'Work', level: 1 }).waitFor();
          await page.getByRole('button', { name: 'Evidence', exact: true }).click();
          await page.getByRole('heading', { name: 'Evidence', level: 1 }).waitFor();
          await page.getByRole('button', { name: 'Decisions', exact: true }).click();
          await page.getByRole('button', { name: /^Review decision:/ }).first().click();
          await page.getByRole('dialog').waitFor();
          await page.keyboard.press('Escape');
          assert.equal(await page.getByRole('dialog').count(), 0);
          await page.setViewportSize({ width: 390, height: 844 });
          assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= window.innerWidth + 1), true);
          await capture('mobile');
          assert.deepEqual(errors, []);
          await browser.close();
          console.log('KLOCGIT_UI_SMOKE:passed');
          JS
