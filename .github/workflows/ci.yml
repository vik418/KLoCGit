name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Install browser system libraries
        run: |
          npm ci
          npx --no-install playwright install-deps chromium
      - name: Verify checkout
        id: verify
        run: npm run verify
      - name: Show formatting differences
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          npx --no-install prettier . --write
          git diff --exit-code

  v1:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:v1
      - name: Show formatting differences
        if: failure()
        run: |
          npx --no-install prettier . --write
          git diff --exit-code

  encoding-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/v1/requirements.txt
      - run: python -m pip install -r tests/v1/requirements.txt
      - run: python tests/v1/encoding_reference.py
