name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Configure test commit identity
        run: |
          git config --global user.name "klocgit tests"
          git config --global user.email "tests@localhost"
      - run: npm ci
      - name: Format and verify composition
        run: |
          npm run format
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const paths = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          for (const path of paths) console.log('KLOCGIT_FORMATTED_B64 ' + JSON.stringify({ path, base64: readFileSync(path).toString('base64') }));
          NODE
          npm run lint
          node --test tests/native-pipeline.test.mjs tests/capabilities.test.mjs
          npm run build
          npm run check:worker
          npm run check:executor
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
