name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install sandbox tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Configure test commit identity
        run: |
          git config --global user.name "klocgit tests"
          git config --global user.email "tests@localhost"
      - run: npm ci
      - name: Format source
        run: npm run format
      - name: Capture formatted source
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const output = execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim();
          for (const path of output ? output.split('\n') : [])
            console.log('KLOCGIT_FORMATTED_B64 ' + JSON.stringify({path,base64:readFileSync(path).toString('base64')}));
          NODE
      - id: lint
        run: npm run lint
        continue-on-error: true
      - id: tests
        run: npm test
        continue-on-error: true
      - id: build
        run: npm run build
        continue-on-error: true
      - id: worker
        run: npm run check:worker
        continue-on-error: true
      - id: executor
        run: npm run check:executor
        continue-on-error: true
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - id: browser
        run: npm run test:browser
        continue-on-error: true
      - name: Require every check
        if: ${{ steps.lint.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure' || steps.worker.outcome == 'failure' || steps.executor.outcome == 'failure' || steps.browser.outcome == 'failure' }}
        run: exit 1
