name: Ranking experiment

on:
  pull_request:
    paths:
      - 'benchmarks/ranking*.mjs'
      - 'benchmarks/support/behavior.mjs'
      - 'benchmarks/support/model-ranker.mjs'
      - 'benchmarks/support/model_ranker.py'
      - 'benchmarks/support/ranker-model.json'
      - 'benchmarks/support/ranker-requirements.txt'
      - 'core/v1/ranking.mjs'
      - 'adapters/ranking/**'
      - 'scripts/configured-ranker.mjs'
      - 'scripts/install-ranker-model.py'
      - '.github/workflows/ranking.yml'
  workflow_dispatch:
    inputs:
      with_ranker:
        description: Compare with the configured ranking service
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/support/ranker-requirements.txt
      - name: Install evaluation and model runtimes
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
          npm ci
          python -m pip install -r benchmarks/support/ranker-requirements.txt
      - name: Verify pinned public model
        run: python scripts/install-ranker-model.py "$RUNNER_TEMP/review-model"
      - name: Compare model ranking at equal evaluation budget
        env:
          KLOCGIT_RANKER_MODEL_DIRECTORY: ${{ runner.temp }}/review-model
        run: |
          export KLOCGIT_RANKER_PYTHON="$(command -v python)"
          mkdir -p results
          node benchmarks/ranking-local.mjs 2 4 30000 benchmarks/support/model-ranker.mjs > results/model-ranking.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/model-ranking.json').read_text())
          print(json.dumps({key: report[key] for key in [
              'schema_version', 'status', 'repetitions', 'pool_digest',
              'ranker_metadata', 'deterministic', 'ranked', 'workload',
          ]}))
          PY
      - name: Retain model measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-ranking-${{ github.sha }}
          path: results/model-ranking.json
          if-no-files-found: error
          retention-days: 14

  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install execution tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: npm ci
      - name: Measure deterministic scheduling
        if: github.event_name != 'workflow_dispatch' || !inputs.with_ranker
        run: |
          mkdir -p results
          node benchmarks/ranking-local.mjs 2 4 5000 > results/ranking.json
      # Ranking credentials stay in the trusted host, outside the Candidate sandbox.
      # Pull requests run the deterministic arm without repository secrets.
      - name: Compare configured ranking service
        if: github.event_name == 'workflow_dispatch' && inputs.with_ranker
        env:
          KLOCGIT_RANKER_URL: ${{ vars.KLOCGIT_RANKER_URL }}
          KLOCGIT_RANKER_TOKEN: ${{ secrets.KLOCGIT_RANKER_TOKEN }}
          KLOCGIT_RANKER_TIMEOUT_MS: ${{ vars.KLOCGIT_RANKER_TIMEOUT_MS }}
          KLOCGIT_RANKER_MAX_BYTES: ${{ vars.KLOCGIT_RANKER_MAX_BYTES }}
        run: |
          mkdir -p results
          node benchmarks/ranking-local.mjs 2 4 5000 scripts/configured-ranker.mjs > results/ranking.json
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ranking-${{ github.sha }}
          path: results/ranking.json
          if-no-files-found: warn
          retention-days: 14
