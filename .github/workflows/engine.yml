name: Engine foundations

on:
  push:
    branches: [feat/convergence-platform]
  pull_request:

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format the test checkout
        run: |
          cargo fmt --all
          npx --yes prettier@3.9.9 --write packages/contracts/src/index.ts packages/contracts/src/canonical.ts packages/contracts/tests/*.ts packages/contracts/tsconfig.json tests/fixtures/canonical.golden.json tests/fixtures/typescript/**/*.ts tests/fixtures/typescript/**/*.json
      - name: Install worker tooling
        run: npm install --prefix apps/worker
      - name: Format sandbox fixtures
        run: |
          npx --yes prettier@3.9.9 --write tests/fixtures/sandbox/**/*.ts tests/fixtures/sandbox/**/*.json tests/fixtures/sandbox/**/*.cjs
          python -m pip install black
          python -m black tests/fixtures/sandbox/python tests/fixtures/sandbox/python-checks
          gofmt -w tests/fixtures/sandbox/go tests/fixtures/sandbox/go-checks
      - name: Format worker source
        run: npx --yes prettier@3.9.9 --write apps/worker/src/**/*.ts apps/worker/src/*.ts apps/worker/tests/**/*.ts apps/worker/tests/*.ts apps/worker/package.json apps/worker/tsconfig.json packages/policy/src/*.ts packages/policy/tests/*.ts packages/policy/tsconfig.json
      - name: Check test syntax
        run: |
          for source in apps/worker/tests/*.ts packages/policy/tests/*.ts; do node --check "$source"; done
      - name: Check worker types
        run: npm run check --prefix apps/worker
      - name: Check contract types
        run: npx --yes --package typescript@5.9.3 tsc -p packages/contracts/tsconfig.json
      - name: Rust engine gate
        run: cargo test -p klocgit-engine
      - name: TypeScript contract gate
        run: npm run test:contracts
      - name: Cross-language gate
        run: npm run test:canonical-cross-language
      - name: Coordination gate
        run: npm run test:coordination
      - name: Policy gate
        run: |
          npx --yes --package typescript@5.9.3 tsc -p packages/policy/tsconfig.json
          npm run test:policy
      - name: Build the isolated evaluator fixture
        run: |
          docker build -f tests/fixtures/sandbox/Dockerfile -t klocgit-evaluator-fixture tests/fixtures/sandbox
          image_oid=$(docker image inspect --format '{{.Id}}' klocgit-evaluator-fixture)
          echo "KLOCGIT_SANDBOX_IMAGE=$image_oid" >> "$GITHUB_ENV"
      - name: Build the native execution image
        run: |
          docker build --build-arg KLOCGIT_IMAGE_TARGET=evaluation -f crates/engine/Dockerfile -t klocgit-native-evaluator .
          image_oid=$(docker image inspect --format '{{.Id}}' klocgit-native-evaluator)
          echo "KLOCGIT_NATIVE_IMAGE=$image_oid" >> "$GITHUB_ENV"
      - name: Sandbox gate
        run: npm run test:sandbox
      - name: Install web tooling
        run: npm install --prefix apps/web
      - name: Format web source
        run: npx --yes prettier@3.9.9 --no-error-on-unmatched-pattern --write apps/web/src/**/*.tsx apps/web/src/**/*.ts apps/web/src/*.tsx apps/web/src/*.ts apps/web/src/*.css apps/web/*.json apps/web/*.ts packages/contracts/src/views.ts
      - name: Build web application
        run: npm run build --prefix apps/web
      - name: Install browser
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Decision workflow gate
        run: npm run test:decisions
      - name: Core browser gate
        run: npm run test:ui:core
      - name: Collect reproducible source
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const files = ['Cargo.lock'];
          const walk = (path) => {
            for (const item of readdirSync(path, { withFileTypes: true })) {
              const child = path + '/' + item.name;
              if (item.isDirectory()) walk(child);
              else if (/\.(rs|ts|tsx|css|json|cjs|py|go|toml)$/.test(child)) files.push(child);
            }
          };
          walk('crates/engine/src');
          walk('crates/engine/tests');
          for (const path of ['packages/contracts/src/index.ts', 'packages/contracts/src/canonical.ts', 'packages/contracts/tsconfig.json']) files.push(path);
          walk('packages/contracts/tests');
          walk('packages/policy/src');
          walk('packages/policy/tests');
          files.push('packages/policy/tsconfig.json');
          walk('tests/fixtures');
          walk('apps/web/src');
          files.push('apps/web/package-lock.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/vite.config.ts', 'apps/web/components.json', 'packages/contracts/src/views.ts');
          walk('apps/worker/src');
          walk('apps/worker/tests');
          files.push('apps/worker/package.json', 'apps/worker/package-lock.json', 'apps/worker/tsconfig.json');
          for (const path of files) {
            try {
              console.log('KLOCGIT_SOURCE ' + JSON.stringify({ path, content: readFileSync(path, 'utf8') }));
            } catch (error) {
              if (path !== 'Cargo.lock' && path !== 'apps/worker/package-lock.json') throw error;
            }
          }
          NODE

  cloudflare-access:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || /[\r\n]/.test(token) || !/^[a-f0-9]{32}$/i.test(account ?? '')) {
            console.error('Cloudflare secrets are missing or malformed.');
            process.exit(1);
          }
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + account;
          const checks = [
            ['account', ''],
            ['workers', '/workers/scripts'],
            ['durable_objects', '/workers/durable_objects/namespaces'],
            ['r2', '/r2/buckets?per_page=1'],
            ['queues', '/queues?per_page=1'],
            ['artifacts', '/artifacts/namespaces?limit=1'],
            ['containers', '/containers/applications?per_page=1'],
          ];
          const results = await Promise.all(checks.map(async ([check, path]) => {
            try {
              const response = await fetch(base + path, {
                headers: { Authorization: 'Bearer ' + token },
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json();
              const passed = response.ok && body.success === true;
              const error_codes = Array.isArray(body.errors)
                ? body.errors.map(error => error?.code).filter(Number.isSafeInteger)
                : [];
              console.log(JSON.stringify({ check, passed, http_status: response.status, error_codes }));
              return passed;
            } catch {
              console.log(JSON.stringify({ check, passed: false, failure: 'TRANSPORT_OR_RESPONSE' }));
              return false;
            }
          }));
          if (results.some(passed => !passed)) process.exitCode = 1;
          NODE
